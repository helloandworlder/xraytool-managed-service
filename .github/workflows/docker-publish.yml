name: XrayTool Docker Publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: xraytool-docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/xraytool-managed-service
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=commit-${{ github.sha }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.run_started_at }}

      - name: Write image evidence
        run: |
          {
            printf 'git_commit_sha=%s\n' '${{ github.sha }}'
            printf 'release_version=%s\n' '${{ github.ref_name }}'
            printf 'docker_image=ghcr.io/${{ github.repository_owner }}/xraytool-managed-service\n'
            printf 'docker_image_digest=%s\n' '${{ steps.build.outputs.digest }}'
            printf 'ci_run_url=%s/%s/actions/runs/%s\n' '${{ github.server_url }}' '${{ github.repository }}' '${{ github.run_id }}'
          } > image-release-manifest.txt

      - name: Upload image evidence
        uses: actions/upload-artifact@v4
        with:
          name: xraytool-image-evidence-${{ github.sha }}
          path: image-release-manifest.txt
